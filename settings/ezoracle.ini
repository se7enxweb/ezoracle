#?ini charset="utf-8"?
# Settings of the ezoracle extension (Oracle database driver for Exponential).
# Override them in settings/override/ezoracle.ini.append.php, or per siteaccess.
# Every feature beyond the plain connection is off by default. See INSTALL,
# "Settings reference", for examples.
#
# The connection itself (user, password, connect string) stays in site.ini
# [DatabaseSettings]: DatabaseImplementation=ezoracle, User, Password and
# Database (the connect string). site.ini [DatabaseSettings] also holds
# OracleEmptyStringForNull and OracleCaseInsensitive (see site.ini.append.php
# of this extension).

[ConnectionSettings]
# Persistent connections (oci_pconnect): inherit (site.ini
# UsePersistentConnection), enabled or disabled. A persistent connection lives
# as long as the PHP process: PHP-FPM worker, Velocity worker, CLI script.
# oci8.persistent_timeout, oci8.max_persistent and oci8.ping_interval in php.ini
# govern them (they cannot be set at run time).
Persistent=inherit

# Database Resident Connection Pooling. enabled appends :POOLED to an Easy
# Connect string (host:port/service:POOLED) or SERVER=POOLED to the descriptor
# built from Hosts[]; for a TNS alias put (SERVER=POOLED) into tnsnames.ora.
# The database needs the pool started (EXECUTE DBMS_CONNECTION_POOL.START_POOL).
DRCP=disabled
# oci8.connection_class for DRCP: sessions of one class are shared, e.g.
# EXPONENTIAL or one class per site. Empty keeps php.ini's value.
ConnectionClass=

# TNS_ADMIN directory (tnsnames.ora, sqlnet.ora) for TNS aliases. Empty keeps
# the environment's. The Oracle client reads it once per PHP process, at its
# first connection: the driver sets it before connecting, but anything that
# used oci8 earlier in the same process fixes the value. The environment of
# the PHP-FPM pool (env[TNS_ADMIN]) or of Velocity is the surer place.
TnsAdmin=

# The connect string. Empty uses site.ini [DatabaseSettings] Database.
# Forms: Easy Connect host:port/service, Easy Connect Plus
# tcp://host:port/service?connect_timeout=5, a TNS alias, or a full descriptor.
ConnectString=

# Failover / load balancing: a descriptor is built from these when Hosts[] and
# ServiceName are set (and ConnectString is empty), e.g.
#   Hosts[]=db1.example.com:1521
#   Hosts[]=db2.example.com:1521
#   ServiceName=EXPPRD
Hosts[]
ServiceName=
Failover=enabled
LoadBalance=disabled
# CONNECT_TIMEOUT and TRANSPORT_CONNECT_TIMEOUT of the built descriptor, seconds (0 = none)
ConnectTimeout=0

# Edition-based redefinition: the edition sessions use (empty = the database default)
Edition=

# Connecting: attempts after the first one, the wait before the first retry
# (seconds, fractions allowed) and the factor the wait grows by each time.
# Without RetryCount the driver uses site.ini [DatabaseSettings] ConnectRetries.
#RetryCount=3
#RetryDelay=1
RetryBackoff=2

# The Oracle errors (ORA- numbers) that mean the connection is lost or the
# service not reachable. On one of them, outside a transaction, the driver
# reconnects; a read (SELECT) is then run again on the new connection, a write
# is reported (it may have been carried out before the connection broke).
ReconnectErrors[]
ReconnectErrors[]=28
ReconnectErrors[]=1012
ReconnectErrors[]=1033
ReconnectErrors[]=1034
ReconnectErrors[]=1089
ReconnectErrors[]=3113
ReconnectErrors[]=3114
ReconnectErrors[]=3135
ReconnectErrors[]=12153
ReconnectErrors[]=12170
ReconnectErrors[]=12514
ReconnectErrors[]=12528
ReconnectErrors[]=12537
ReconnectErrors[]=12541
ReconnectErrors[]=12543
ReconnectErrors[]=12545
ReconnectErrors[]=12547
ReconnectErrors[]=12570
ReconnectErrors[]=25408
# run a read again after reconnecting
RetryReads=enabled

# Longest time one round trip may take, milliseconds (oci_set_call_timeout,
# Oracle client 18c or later). 0 = no limit. A statement that runs longer ends
# with ORA-03136/ORA-03156; a long import or cronjob may need 0.
CallTimeout=0

# Keep-alive for long running processes (Velocity workers, CLI scripts,
# cronjobs): when the connection was idle for longer than this many seconds,
# the next statement is preceded by a round trip, and a dead connection (the
# database was restarted, a firewall dropped it) is replaced first. 0 = off.
KeepAliveInterval=0

[PerformanceSettings]
# Rows fetched per round trip for queries (oci_set_prefetch). 0 keeps php.ini
# oci8.default_prefetch (100). Larger values help big result sets.
Prefetch=0
# LOB bytes sent with the row (oci_set_prefetch_lob, oci8 3.2+ and Oracle client
# 12.2+), saving a round trip per CLOB. 0 keeps php.ini oci8.prefetch_lob_size.
LobPrefetch=0
# The statement cache (oci8.statement_cache_size) is a php.ini setting.

[TraceSettings]
# What a DBA sees of an Exponential session in V$SESSION (CLIENT_IDENTIFIER,
# MODULE, ACTION, CLIENT_INFO) and in AWR/ASH reports. Patterns:
# %siteaccess% %module% %view% %user_id% %script% %pid%. Empty = not set.
# Examples:
#   ClientIdentifier=%siteaccess%:%user_id%
#   ModuleName=Exponential %siteaccess%
#   Action=%module%/%view%
ClientIdentifier=
ModuleName=
Action=
ClientInfo=

[LogSettings]
# Statements that take this many milliseconds or more are written to
# var/log/<SlowQueryLog>. 0 = off. Bound values are logged as their length only.
SlowQueryThreshold=0
SlowQueryLog=oracle-slow.log
# replace the string literals of the logged SQL by '?' (no personal data in the log)
MaskLiterals=enabled
# count the statements per type (SELECT, INSERT, ...) in the debug output's
# accumulators (needs site.ini [DebugSettings] DebugOutput=enabled)
StatementCounts=disabled

[CaseInsensitiveSettings]
# The columns the helper ext:ezoracle:ci-indexes gives linguistic indexes
# (NLSSORT( column, 'NLS_SORT=<site.ini OracleCaseInsensitiveSort>' )), for
# OracleCaseInsensitive=enabled: table.column
Columns[]
Columns[]=ezuser.login
Columns[]=ezuser.email
Columns[]=ezcontentobject.name
Columns[]=ezcontentobject_name.name
Columns[]=ezcontentobject.remote_id
Columns[]=ezcontentobject_tree.remote_id
Columns[]=ezcontentclass.identifier
Columns[]=ezcontentclass_attribute.identifier
Columns[]=ezurlalias_ml.text
Columns[]=ezsection.identifier
Columns[]=eztags_keyword.keyword

[HealthSettings]
# ext:ezoracle:health and the health cronjob: a tablespace used more than this
# percent is a warning
TablespaceWarnPercent=85
# more than this many invalid objects fails the check (0 = any invalid object warns)
InvalidObjectsFail=0
# blocked sessions longer than this many seconds are reported
LockWaitSeconds=30

[StatisticsSettings]
# DBMS_STATS.GATHER_SCHEMA_STATS options of ext:ezoracle:gather-stats and the
# statistics cronjob. EstimatePercent: AUTO (DBMS_STATS.AUTO_SAMPLE_SIZE) or 1-100.
EstimatePercent=AUTO
# parallel degree, 0 = the table's default
Degree=0
Cascade=enabled
# GATHER AUTO (only stale/missing statistics), GATHER STALE, GATHER EMPTY or GATHER
Options=GATHER AUTO

[DataPumpSettings]
# directory object on the database server that ext:ezoracle:datapump writes to
# and reads from (the user needs READ, WRITE on it)
Directory=DATA_PUMP_DIR

[CronjobSettings]
# The cronjob part ezoracle (settings/cronjob.ini.append.php of this
# extension) runs these; each is off until enabled here.
GatherStatistics=disabled
HealthMonitor=disabled
# the health monitor mails its report here when a check fails or warns (empty = log only)
HealthMailReceivers[]
PurgeRecycleBin=disabled
# SequenceCheck reports sequences behind their tables; SequenceFix moves them
SequenceCheck=disabled
SequenceFix=disabled
